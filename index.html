<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<title>Composition Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<main id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <svg id="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div id="smart" class="hidden" aria-hidden="true">
    <div id="subjectBox"></div>
    <div id="targetDot"></div>
  </div>
  <p id="hintBubble" class="hidden" role="status"></p>
  <div id="mask" aria-hidden="true"></div>
  <svg id="horizon" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line id="horizonLine" x1="-20" y1="50" x2="120" y2="50"></line>
    <line id="horizonCenter" x1="0" y1="50" x2="100" y2="50"></line>
  </svg>
  <div id="flash"></div>

  <div id="bar" class="hidden">
    <div id="picker" role="group" aria-label="Composition guide">
      <button data-guide="off" aria-pressed="false" title="Off (1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2"/><line x1="5" y1="5" x2="19" y2="19"/>
        </svg>
        <span>Off</span>
      </button>
      <button data-guide="thirds" aria-pressed="true" title="Thirds (2)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="1"/>
          <line x1="9.33" y1="4" x2="9.33" y2="20"/><line x1="14.67" y1="4" x2="14.67" y2="20"/>
          <line x1="4" y1="9.33" x2="20" y2="9.33"/><line x1="4" y1="14.67" x2="20" y2="14.67"/>
        </svg>
        <span>Thirds</span>
      </button>
      <button data-guide="phi" aria-pressed="false" title="Golden grid (3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="1"/>
          <line x1="10.11" y1="4" x2="10.11" y2="20"/><line x1="13.89" y1="4" x2="13.89" y2="20"/>
          <line x1="4" y1="10.11" x2="20" y2="10.11"/><line x1="4" y1="13.89" x2="20" y2="13.89"/>
        </svg>
        <span>Golden</span>
      </button>
      <button data-guide="spiral" aria-pressed="false" title="Spiral (4)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M 2 22 A 12.36 20 0 0 1 14.36 2 A 7.64 12.36 0 0 1 22 14.36 A 4.72 7.64 0 0 1 17.28 22 A 2.92 4.72 0 0 1 14.36 17.28 A 1.8 2.92 0 0 1 16.16 14.36 A 1.11 1.8 0 0 1 17.28 16.16"/>
        </svg>
        <span>Spiral</span>
      </button>
      <button data-guide="diagonals" aria-pressed="false" title="Diagonals (5)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="1"/><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/>
        </svg>
        <span>Diagonals</span>
      </button>
      <button data-guide="center" aria-pressed="false" title="Center (6)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="1"/>
          <line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/>
          <circle cx="12" cy="12" r="3.2"/>
        </svg>
        <span>Center</span>
      </button>
    </div>

    <div id="row">
      <a id="thumb" aria-label="Open last photo" target="_blank" rel="noopener"></a>
      <button id="shutter" aria-label="Take photo" title="Space"></button>
      <div id="spiralCtl" class="hidden">
        <button id="rotate" aria-label="Rotate spiral" title="R">Rotate</button>
        <button id="flip" aria-label="Flip spiral" title="F">Flip</button>
      </div>
    </div>

    <label id="zoomCtl">
      <span>Zoom</span>
      <input type="range" id="zoom" min="1" max="3" step="0.1" value="1">
      <output id="zoomValue" for="zoom">1.0x</output>
    </label>

    <div id="tray">
      <div id="aspectCtl" class="trayGroup" role="group" aria-label="Aspect ratio">
        <button data-aspect="full" aria-pressed="true">Full</button>
        <button data-aspect="4:3" aria-pressed="false">4:3</button>
        <button data-aspect="1:1" aria-pressed="false">1:1</button>
        <button data-aspect="16:9" aria-pressed="false">16:9</button>
      </div>
      <div id="miscCtl" class="trayGroup">
        <button id="flipCam" aria-label="Switch camera" title="C">Flip camera</button>
        <button id="levelToggle" aria-pressed="false" title="L">Level</button>
        <button id="smartToggle" aria-pressed="false" title="Detect the main subject and hint how to frame it">Smart</button>
        <button id="adjustToggle" aria-pressed="false" title="Filters, brightness, contrast, saturation, focus">Adjust</button>
        <label id="opacityCtl">
          <span>Grid</span>
          <input type="range" id="opacity" min="20" max="100" value="90">
          <output id="opacityValue" for="opacity">90%</output>
        </label>
        <div id="colorCtl" role="group" aria-label="Grid color">
          <button data-color="#e3b23c" style="--sw:#e3b23c" aria-pressed="true" aria-label="Gold"></button>
          <button data-color="#f2efe8" style="--sw:#f2efe8" aria-pressed="false" aria-label="White"></button>
          <button data-color="#4fd1ff" style="--sw:#4fd1ff" aria-pressed="false" aria-label="Cyan"></button>
          <button data-color="#ff5c5c" style="--sw:#ff5c5c" aria-pressed="false" aria-label="Red"></button>
        </div>
      </div>

      <div id="adjustPanel" class="hidden">
        <div id="filterCtl" role="group" aria-label="Filter"></div>
        <label class="adjustSlider">
          <span>Brightness</span>
          <input type="range" id="brightness" min="50" max="150" value="100">
          <output id="brightnessValue" for="brightness">100%</output>
        </label>
        <label class="adjustSlider">
          <span>Contrast</span>
          <input type="range" id="contrast" min="50" max="150" value="100">
          <output id="contrastValue" for="contrast">100%</output>
        </label>
        <label class="adjustSlider">
          <span>Saturation</span>
          <input type="range" id="saturation" min="0" max="200" value="100">
          <output id="saturationValue" for="saturation">100%</output>
        </label>
        <div id="focusCtl" class="hidden">
          <span>Focus</span>
          <div id="focusModes" role="group" aria-label="Focus mode"></div>
          <label id="focusDistanceCtl" class="hidden adjustSlider">
            <span>Dist.</span>
            <input type="range" id="focusDistance" min="0" max="1" step="0.01" value="0">
          </label>
        </div>
        <p id="focusNote" class="hidden">This camera/browser doesn't expose manual focus control.</p>
      </div>
    </div>
  </div>

  <div id="gate">
    <svg id="aperture" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52"/>
      <path d="M 60 8 L 72.04 46.62 L 54.44 42.88 Z"/>
      <path d="M 105.03 34 L 77.61 63.74 L 72.04 46.62 Z"/>
      <path d="M 105.03 86 L 65.56 77.12 L 77.61 63.74 Z"/>
      <path d="M 60 112 L 47.96 73.38 L 65.56 77.12 Z"/>
      <path d="M 14.97 86 L 42.39 56.26 L 47.96 73.38 Z"/>
      <path d="M 14.97 34 L 54.44 42.88 L 42.39 56.26 Z"/>
    </svg>
    <h1>Composition Camera</h1>
    <p>Frame your shots with rule of thirds, golden ratio, and spiral guides. The camera stays on your device.</p>
    <button id="start">Allow camera</button>
    <p id="err" role="alert"></p>
  </div>
</main>
<p id="hint" aria-hidden="true">Space capture · 1–6 guides · R/F spiral · C camera · L level · S smart · A adjust · +/- zoom</p>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
